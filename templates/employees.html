<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employees List</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
            font-size: 28px;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .add-btn {
            background-color: #198754;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
        }

        .add-btn:hover {
            background-color: #157347;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 8px;
        }

        th,
        td {
            padding: 14px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #0d6efd;
            color: white;
        }

        tr:hover {
            background-color: #f2f2f2;
        }

        .action-btn {
            display: inline-block;
            margin: 2px;
            padding: 7px 12px;
            background-color: #0d6efd;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            color: white;
        }

        .action-btn:hover {
            background-color: #0b5ed7;
        }

        .del-btn {
            background-color: #dc3545;
        }

        .del-btn:hover {
            background-color: #bb2d3b;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .container {
                padding: 15px;
            }

            th,
            td {
                padding: 8px;
                font-size: 13px;
            }

            .action-btn {
                padding: 5px 8px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Employees List</h2>

        <div class="top-bar">
            <a href="/employees/create" class="add-btn">
                + Add Employee
            </a>
        </div>

        <table>

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Action</th>
            </tr>

            {% for employee in employees %}

            <tr>
                <td>{{ employee[0] }}</td>
                <td>{{ employee[1] }}</td>
                <td>{{ employee[2] }}</td>

                <td>
                    <a class="action-btn"
                       href="/employees/edit/{{ employee[0] }}">
                        Edit
                    </a>

                    <a class="action-btn del-btn"
                       href="/employees/delete/{{ employee[0] }}"
                       onclick="return confirm('Are you sure you want to delete this employee?')">
                        Delete
                    </a>
                </td>
            </tr>

            {% endfor %}

        </table>

    </div>

</body>

</html>
